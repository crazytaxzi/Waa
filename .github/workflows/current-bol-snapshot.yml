name: Current Missing BOL Snapshot

on:
  push:
    branches:
      - agent/current-bol-snapshot

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integrated current-BOL changes
        shell: pwsh
        run: python .github/apply_current_bol_snapshot.py
      - name: Windows PowerShell 5.1 parse gate
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){ $bad += "$($_.FullName): $($errors -join '; ')" }
          }
          if($bad.Count){ $bad | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: JavaScript syntax
        shell: pwsh
        run: node --check web/app.js
      - name: Core regression suite
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -SqlitePath ./runtime/sqlite/sqlite3.exe
      - name: Identity regression suite
        shell: pwsh
        run: ./tests/Identity.Tests.ps1 -SqlitePath ./runtime/sqlite/sqlite3.exe
      - name: Commit production integration and remove temporary harness
        shell: pwsh
        run: |
          Remove-Item .github/apply_current_bol_snapshot.py -Force
          Remove-Item .github/workflows/current-bol-snapshot.yml -Force
          git config user.name "Sentionce"
          git config user.email "crazytaxzi@gmail.com"
          git add -A
          git commit -m "Show only current Missing BOL report operationally"
          git push origin HEAD:agent/current-bol-snapshot
