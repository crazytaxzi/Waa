name: Integrated Idle Coaching tab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Stage integrated Idle Coaching tab'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate Idle Coaching page into existing WAA flow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $py = @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8').replace('\r\n','\n')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          # Core data layer: expose the already-owned idle_plan call history as one canonical list.
          p = 'src/Waa.psm1'
          s = read(p)
          if 'function Get-IdleCoachingLog {' not in s:
              marker = 'function Get-Organizer {'
              if marker not in s:
                  raise SystemExit('Get-Organizer insertion point not found')
              fn = r'''function Get-IdleCoachingLog {
    if(Test-WaaLiveStoreOnline){Invoke-WaaLiveCheckpoint -Force|Out-Null}
    $sql=@'
WITH coaching AS (
  SELECT c.id,c.driver_id,c.cycle_key,
         coalesce(c.completed_at,c.updated_at,c.opened_at) talked_at,
         trim(c.idle_plan) idle_plan,
         CASE WHEN instr(c.cycle_key,'|')>0 THEN substr(c.cycle_key,1,instr(c.cycle_key,'|')-1) ELSE '' END cycle_truck
  FROM driver_call_sessions c
  WHERE trim(coalesce(c.idle_plan,''))<>''
)
SELECT c.id,c.driver_id,d.full_name,d.pta_code,
       CASE WHEN trim(coalesce(c.cycle_truck,''))='' OR c.cycle_truck='NO-TRUCK' THEN
         coalesce((SELECT th.truck FROM truck_history th
                   WHERE th.driver_id=c.driver_id AND th.observed_at<=c.talked_at
                   ORDER BY th.observed_at DESC,th.id DESC LIMIT 1),'')
       ELSE c.cycle_truck END truck,
       c.talked_at,c.idle_plan,
       (SELECT round(i.idle_hours*100.0/nullif(i.engine_hours,0),2)
        FROM idle_periods i
        WHERE i.driver_id=c.driver_id AND i.period_end<=substr(c.talked_at,1,10)
        ORDER BY i.period_end DESC,i.id DESC LIMIT 1) idle_percent,
       (SELECT i.period_end
        FROM idle_periods i
        WHERE i.driver_id=c.driver_id AND i.period_end<=substr(c.talked_at,1,10)
        ORDER BY i.period_end DESC,i.id DESC LIMIT 1) period_end
FROM coaching c
JOIN drivers d ON d.id=c.driver_id
ORDER BY c.talked_at DESC,c.id DESC;
'@
    return Invoke-Sql $sql -Json
}

'''
              s = s.replace(marker, fn + marker, 1)
              write(p, s)

          # HTTP surface: this is a normal read route in the existing server, not a separate service.
          p = 'src/Server.ps1'
          s = read(p)
          if "/api/idle-coaching" not in s:
              marker = "                    elseif ($method -eq 'GET' -and $path -eq '/api/organizer') {"
              if marker not in s:
                  raise SystemExit('Server organizer route insertion point not found')
              route = "                    elseif ($method -eq 'GET' -and $path -eq '/api/idle-coaching') {\n                        Send-JsonArray $request.stream 200 @(Get-IdleCoachingLog) | Out-Null\n                    }\n"
              s = s.replace(marker, route + marker, 1)
              write(p, s)

          # Navigation: make it a first-class WAA tab.
          p = 'web/index.html'
          s = read(p)
          if '<a href="#idle">Idle Coaching</a>' not in s:
              old = '    <a href="#workflow">Workflow</a>\n    <a href="#bols">Missing BOLs</a>'
              new = '    <a href="#workflow">Workflow</a>\n    <a href="#idle">Idle Coaching</a>\n    <a href="#bols">Missing BOLs</a>'
              if old not in s:
                  raise SystemExit('Navigation insertion point not found')
              s = s.replace(old,new,1)
          s = s.replace('styles.css?v=20260809.14','styles.css?v=20260810.15')
          s = s.replace('app.js?v=20260809.14','app.js?v=20260810.15')
          write(p,s)

          # Frontend: one focused list of only idle coaching conversations.
          p = 'web/app.js'
          s = read(p)
          if 'async function idleCoachingLog() {' not in s:
              marker = 'async function organizer() {'
              if marker not in s:
                  raise SystemExit('Organizer function insertion point not found')
              page = r'''async function idleCoachingLog() {
  const rows = await cachedApi('/api/idle-coaching', 5000);
  rows.forEach(row => { row._search = `${row.full_name} ${row.truck} ${row.pta_code} ${row.idle_plan}`.toLowerCase(); });
  const uniqueDrivers = new Set(rows.map(row => Number(row.driver_id)));
  const above50 = rows.filter(row => Number.isFinite(Number(row.idle_percent)) && Number(row.idle_percent) > 50).length;
  const latest = rows[0];

  $('#app').innerHTML = pageHead('Idle Coaching', 'Only the idle conversations you recorded with drivers. No fuel, ETA, BOL, wrap-up, or general-note noise.', 'WAA // Coaching Record') + `
    <section class="idle-log-summary">
      <div class="idle-log-metric"><span>Conversations</span><b>${rows.length}</b><small>Idle discussions recorded</small></div>
      <div class="idle-log-metric"><span>Drivers</span><b>${uniqueDrivers.size}</b><small>Drivers coached on idle</small></div>
      <div class="idle-log-metric"><span>Over 50% at talk</span><b>${above50}</b><small>Coaching conversations above target</small></div>
      <div class="idle-log-metric"><span>Most recent</span><b>${latest ? esc(displayDate(latest.talked_at)) : '—'}</b><small>${latest ? esc(latest.full_name) : 'No coaching recorded yet'}</small></div>
    </section>
    <section class="glass-panel idle-log-panel">
      <div class="table-toolbar">
        <div class="searchbox"><span aria-hidden="true">⌕</span><input id="idleLogSearch" placeholder="Search driver, truck, or what you discussed"></div>
        <span id="idleLogCount" class="queue-count"></span>
      </div>
      <div id="idleLogList" class="idle-log-list"></div>
    </section>`;

  const draw = () => {
    const query = $('#idleLogSearch').value.trim().toLowerCase();
    const visible = rows.filter(row => !query || row._search.includes(query));
    $('#idleLogCount').textContent = `${visible.length} conversation${visible.length === 1 ? '' : 's'}`;
    setCardQueue([...new Set(visible.map(row => Number(row.driver_id)))]);
    $('#idleLogList').innerHTML = visible.length ? visible.map(row => {
      const score = Number(row.idle_percent);
      const tone = Number.isFinite(score) && score > 50 ? 'hot' : 'good';
      const period = row.period_end ? new Date(row.period_end).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : null;
      return `<button class="idle-log-entry open" data-id="${row.driver_id}" type="button">
        <div class="idle-log-when"><time>${esc(displayDate(row.talked_at))}</time><small>${period ? `7D ending ${esc(period)}` : 'Idle snapshot unavailable'}</small></div>
        <div class="idle-log-driver"><b>${esc(row.truck || 'No truck')} · ${esc(row.full_name)}</b><small>${esc(row.pta_code || 'No PTA code')}</small></div>
        <div class="idle-log-score ${tone}"><b>${fmtPercent(row.idle_percent)}</b><span>7D idle</span></div>
        <p class="idle-log-note">${esc(row.idle_plan)}</p>
        <span class="idle-log-open">Open Driver →</span>
      </button>`;
    }).join('') : '<p class="empty-copy idle-log-empty">No idle coaching conversations match this search.</p>';
  };

  $('#idleLogSearch').addEventListener('input', debounce(draw));
  draw();
}

'''
              s = s.replace(marker, page + marker, 1)

          routes_old = "  workflow: () => queue(false),\n  bols,"
          routes_new = "  workflow: () => queue(false),\n  idle: idleCoachingLog,\n  bols,"
          if routes_old not in s and 'idle: idleCoachingLog,' not in s:
              raise SystemExit('Route table insertion point not found')
          s = s.replace(routes_old,routes_new,1)

          s = s.replace("invalidate('/api/activity', `/api/drivers/${driverId}`);",
                        "invalidate('/api/activity', '/api/idle-coaching', `/api/drivers/${driverId}`);")
          s = s.replace("invalidate('/api/drivers', '/api/dashboard', '/api/activity', `/api/drivers/${finishedId}`);",
                        "invalidate('/api/drivers', '/api/dashboard', '/api/activity', '/api/idle-coaching', `/api/drivers/${finishedId}`);")
          s = s.replace("invalidate('/api/dashboard', '/api/drivers', '/api/bols', '/api/report-intake', '/api/data-quality');",
                        "invalidate('/api/dashboard', '/api/drivers', '/api/bols', '/api/idle-coaching', '/api/report-intake', '/api/data-quality');")
          write(p,s)

          # Styling belongs to the main visual system.
          p = 'web/styles.css'
          s = read(p)
          if '.idle-log-summary{' not in s:
              css = r'''

.idle-log-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.idle-log-metric{position:relative;min-height:112px;padding:16px 18px;border:1px solid #344154;background:linear-gradient(145deg,#17202cdd,#0c121bdd);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.idle-log-metric::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue),var(--purple));box-shadow:0 0 16px #36bfff55}.idle-log-metric span{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.idle-log-metric b{display:block;margin:7px 0 3px;color:var(--white);font:800 clamp(22px,2.3vw,34px) Bahnschrift,"Segoe UI",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.idle-log-metric small{color:var(--muted);font-size:11px}.idle-log-panel{padding:0}.idle-log-list{display:grid}.idle-log-entry{display:grid;grid-template-columns:170px minmax(210px,.8fr) 105px minmax(280px,1.5fr) auto;gap:16px;align-items:center;width:100%;padding:16px 18px;border:0;border-bottom:1px solid #293546;background:linear-gradient(90deg,#ffffff04,transparent);color:var(--white);text-align:left;cursor:pointer;transition:.15s ease}.idle-log-entry:last-child{border-bottom:0}.idle-log-entry:hover,.idle-log-entry:focus-visible{background:linear-gradient(90deg,#7cff3a0c,#36bfff08 55%,#b34cff0c);box-shadow:inset 3px 0 var(--green);outline:none}.idle-log-when time,.idle-log-driver b{display:block;color:var(--white);font-weight:700}.idle-log-when small,.idle-log-driver small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.idle-log-driver b{font-size:13px}.idle-log-score{text-align:center}.idle-log-score b{display:block;font:800 24px Bahnschrift,"Segoe UI",sans-serif}.idle-log-score span{display:block;margin-top:2px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em}.idle-log-score.good b{color:var(--green);text-shadow:0 0 14px #7cff3a38}.idle-log-score.hot b{color:var(--red);text-shadow:0 0 14px #ff405d38}.idle-log-note{margin:0;color:#e9eef4;line-height:1.5;white-space:pre-wrap}.idle-log-open{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}.idle-log-empty{padding:28px!important;margin:0!important}
@media(max-width:1100px){.idle-log-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.idle-log-entry{grid-template-columns:150px 1fr 95px}.idle-log-note{grid-column:1/-1}.idle-log-open{display:none}}
@media(max-width:700px){.idle-log-summary{grid-template-columns:1fr 1fr}.idle-log-entry{grid-template-columns:1fr auto;gap:9px}.idle-log-when,.idle-log-driver{grid-column:1}.idle-log-score{grid-column:2;grid-row:1/3}.idle-log-note{grid-column:1/-1}.idle-log-panel .table-toolbar{align-items:stretch;flex-direction:column}.idle-log-panel .searchbox{min-width:0}.idle-log-panel .queue-count{text-align:left}}
'''
              write(p,s.rstrip()+css)

          # Regression coverage: the page source is idle-only and the canonical list excludes fuel-only calls.
          p = 'tests/Run-Tests.ps1'
          s = read(p)
          target = "Assert ($coachedCard.idle_coaching.Count-eq1-and$coachedCard.idle_coaching[0].idle_plan-eq'Reduce long-wait idling'-and[double]$coachedCard.idle_coaching[0].idle_percent-eq80) 'driver card idle coaching history contains only idle discussion and relevant rolling percentage'"
          extra = target + ";$idleLog=@(Get-IdleCoachingLog);$coachedLog=@($idleLog|Where-Object{$_.driver_id-eq$coachedId});Assert ($coachedLog.Count-eq1-and$coachedLog[0].idle_plan-eq'Reduce long-wait idling'-and[double]$coachedLog[0].idle_percent-eq80) 'Idle Coaching tab data contains only idle-plan conversations and the relevant rolling percentage'"
          if target not in s:
              raise SystemExit('Idle coaching regression insertion point not found')
          s = s.replace(target,extra,1)
          s = s.replace("Assert ($webIndex.Contains('#organizer')-and$webIndex.Contains('#activity')) 'driver organizer and daily-review tabs are integrated navigation';",
                        "Assert ($webIndex.Contains('#organizer')-and$webIndex.Contains('#activity')-and$webIndex.Contains('#idle')) 'driver organizer, Idle Coaching, and daily-review tabs are integrated navigation';")
          marker = "Assert ($serverSource.Contains('/api/activity/cleanup')-and$appSource.Contains('cleanupActivity')) 'Daily Review exposes integrated bulk noise cleanup';"
          addition = marker + "Assert ($serverSource.Contains('/api/idle-coaching')-and$appSource.Contains('idleCoachingLog')-and$appSource.Contains('idle-log-note')) 'Idle Coaching tab is integrated through the normal server and client routing';"
          if marker not in s:
              raise SystemExit('Frontend integration regression insertion point not found')
          s = s.replace(marker,addition,1)
          write(p,s)
          '@
          $py | python -

      - name: Parse all PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Recurse -File | Where-Object { $_.Extension -eq '.ps1' -or $_.Extension -eq '.psm1' })
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw "Windows PowerShell 5.1 parser errors in $($file.FullName)" }
          }
          Write-Host "Windows PowerShell 5.1 parsed $($files.Count) PowerShell files successfully."

      - name: Validate JavaScript
        shell: pwsh
        run: node --check web/app.js

      - name: Run established regression suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Run-Tests.ps1
          & .\tests\Identity.Tests.ps1

      - name: Commit integrated feature and remove validation workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Sentionce'
          git config user.email 'crazytaxzi@gmail.com'
          git rm .github/workflows/idle-coaching-tab.yml
          git add src/Waa.psm1 src/Server.ps1 web/index.html web/app.js web/styles.css tests/Run-Tests.ps1
          git commit -m 'Add dedicated Idle Coaching history tab'
          git push origin HEAD:main
