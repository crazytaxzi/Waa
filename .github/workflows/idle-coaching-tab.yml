name: Integrated Idle Coaching tab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Retry Idle Coaching integration validation'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate page into existing WAA architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/apply_idle_tab.py
          $path = 'src/Waa.psm1'
          $text = [IO.File]::ReadAllText((Resolve-Path $path))
          $old = 'Get-DriverCard,Save-DriverAction'
          $new = 'Get-DriverCard,Get-IdleCoachingLog,Save-DriverAction'
          if (-not $text.Contains($old)) { throw 'Module export insertion point not found.' }
          [IO.File]::WriteAllText((Resolve-Path $path),$text.Replace($old,$new),[Text.UTF8Encoding]::new($false))

      - name: Parse all PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Recurse -File | Where-Object { $_.Extension -eq '.ps1' -or $_.Extension -eq '.psm1' })
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "Windows PowerShell 5.1 parser errors in $($file.FullName)"
            }
          }
          Write-Host "Windows PowerShell 5.1 parsed $($files.Count) PowerShell files successfully."

      - name: Validate JavaScript
        shell: pwsh
        run: node --check web/app.js

      - name: Run established regression suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Run-Tests.ps1
          & .\tests\Identity.Tests.ps1

      - name: Commit integrated feature and remove validation files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Sentionce'
          git config user.email 'crazytaxzi@gmail.com'
          git rm .github/workflows/idle-coaching-tab.yml .github/apply_idle_tab.py
          git add src/Waa.psm1 src/Server.ps1 web/index.html web/app.js web/styles.css tests/Run-Tests.ps1
          git commit -m 'Add dedicated Idle Coaching history tab'
          git push origin HEAD:main
