name: Idle Snapshot and Simplified Call Flow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run one-shot idle snapshot and form simplification'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integrated changes
        shell: pwsh
        run: |
          python .github/apply_idle_snapshot_simplify.py
          python .github/fix_simplified_call_test.py
      - name: Windows PowerShell 5.1 parse gate
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){ $bad += "$($_.FullName): $($errors -join '; ')" }
          }
          if($bad.Count){ $bad | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: JavaScript syntax
        shell: pwsh
        run: node --check web/app.js
      - name: Core regression suite
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -SqlitePath ./runtime/sqlite/sqlite3.exe
      - name: Identity regression suite
        shell: pwsh
        run: ./tests/Identity.Tests.ps1 -SqlitePath ./runtime/sqlite/sqlite3.exe
      - name: Commit production integration and remove temporary harness
        shell: pwsh
        run: |
          Remove-Item .github/apply_idle_snapshot_simplify.py -Force
          Remove-Item .github/fix_simplified_call_test.py -Force
          Remove-Item .github/workflows/idle-snapshot-simplify.yml -Force
          git config user.name "Sentionce"
          git config user.email "crazytaxzi@gmail.com"
          git add -A
          git commit -m "Persist idle snapshots and simplify call inputs"
          git push origin HEAD:main
