name: Windows PowerShell 5.1 compatibility validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-fix:
    if: github.event.head_commit.message == 'Stage Windows PowerShell 5.1 compatibility validation'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct PS5.1-incompatible identity collection syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $py = @'
          from pathlib import Path
          p = Path('src/ReportParsing.ps1')
          s = p.read_text(encoding='utf-8')
          old1 = """    $observedCodes = @(\n        @($familyDrivers|ForEach-Object{Normalize-WaaPtaCode ([string]$_.pta_code)})+\n        @($familyAliases|ForEach-Object{Normalize-WaaPtaCode ([string]$_.alias_value)})\n        |Where-Object{$_}|Sort-Object Length,@{Expression={$_}} -Unique\n    )"""
          new1 = """    $observedCodeCandidates = @($familyDrivers | ForEach-Object { Normalize-WaaPtaCode ([string]$_.pta_code) }) +\n                              @($familyAliases | ForEach-Object { Normalize-WaaPtaCode ([string]$_.alias_value) })\n    $observedCodes = @($observedCodeCandidates | Where-Object { $_ } | Sort-Object Length,@{Expression={$_}} -Unique)"""
          old2 = """        $owners=@(\n            @($familyDrivers|Where-Object{(Normalize-WaaPtaCode ([string]$_.pta_code))-eq$actualCode}|ForEach-Object{[int]$_.id})+\n            @($familyAliases|Where-Object{(Normalize-WaaPtaCode ([string]$_.alias_value))-eq$actualCode}|ForEach-Object{[int]$_.driver_id})\n            |Select-Object -Unique\n        )"""
          new2 = """        $ownerCandidates = @($familyDrivers | Where-Object { (Normalize-WaaPtaCode ([string]$_.pta_code)) -eq $actualCode } | ForEach-Object { [int]$_.id }) +\n                           @($familyAliases | Where-Object { (Normalize-WaaPtaCode ([string]$_.alias_value)) -eq $actualCode } | ForEach-Object { [int]$_.driver_id })\n        $owners = @($ownerCandidates | Select-Object -Unique)"""
          n = s.replace('\r\n','\n')
          if old1 not in n:
              raise SystemExit('observed-code target block not found exactly')
          if old2 not in n:
              raise SystemExit('owner target block not found exactly')
          n = n.replace(old1,new1).replace(old2,new2)
          p.write_text(n, encoding='utf-8', newline='\n')
          '@
          $py | python -

      - name: Parse all PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Recurse -File | Where-Object { $_.Extension -eq '.ps1' -or $_.Extension -eq '.psm1' })
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "Windows PowerShell 5.1 parser errors in $($file.FullName)"
            }
          }
          Write-Host "Windows PowerShell 5.1 parsed $($files.Count) PowerShell files successfully."

      - name: Run regression suites under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Run-Tests.ps1
          & .\tests\Identity.Tests.ps1

      - name: Commit production fix and remove validation workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Sentionce'
          git config user.email 'crazytaxzi@gmail.com'
          git rm .github/workflows/ps51-validation.yml
          git add src/ReportParsing.ps1
          git commit -m 'Fix Windows PowerShell 5.1 parser compatibility'
          git push origin HEAD:main
