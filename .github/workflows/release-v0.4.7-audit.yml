name: Publish WAA v0.4.7 Audit Hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.4.7-audit.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply audited v0.4.7 source changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path.cwd()

          def read(rel):
              return (root / rel).read_text(encoding='utf-8')

          def write(rel, text):
              (root / rel).write_text(text, encoding='utf-8', newline='')

          def replace(rel, old, new, count=1):
              text = read(rel)
              if text.count(old) < count:
                  raise RuntimeError(f"Expected pattern not found in {rel}: {old[:120]!r}")
              write(rel, text.replace(old, new, count))

          # Repository: non-destructive Handoff dismissal, reopen restoration, schema guard.
          rel = 'src/Waa.App/Data/WaaRepository.cs'
          replace(rel,
          '''    public bool ReopenWorkEntry(long workEntryId)\n    {\n        if (workEntryId <= 0)\n        {\n            throw new ArgumentOutOfRangeException(nameof(workEntryId));\n        }\n\n        using var connection = OpenConnection();\n        using var command = connection.CreateCommand();\n        command.CommandText = """\n            UPDATE work_entries\n            SET resolved_utc = NULL\n            WHERE id = $id\n              AND resolved_utc IS NOT NULL\n              AND status IN ('Waiting', 'FollowUp');\n            """;\n        command.Parameters.AddWithValue("$id", workEntryId);\n        return command.ExecuteNonQuery() == 1;\n    }\n''',
          '''    public bool ReopenWorkEntry(long workEntryId)\n    {\n        if (workEntryId <= 0)\n        {\n            throw new ArgumentOutOfRangeException(nameof(workEntryId));\n        }\n\n        using var connection = OpenConnection();\n        using var transaction = connection.BeginTransaction();\n        using var command = connection.CreateCommand();\n        command.Transaction = transaction;\n        command.CommandText = """\n            UPDATE work_entries\n            SET resolved_utc = NULL\n            WHERE id = $id\n              AND resolved_utc IS NOT NULL\n              AND status IN ('Waiting', 'FollowUp');\n            """;\n        command.Parameters.AddWithValue("$id", workEntryId);\n        var reopened = command.ExecuteNonQuery() == 1;\n        if (reopened)\n        {\n            using var restoreHandoff = connection.CreateCommand();\n            restoreHandoff.Transaction = transaction;\n            restoreHandoff.CommandText = "DELETE FROM handoff_dismissals WHERE work_entry_id = $id;";\n            restoreHandoff.Parameters.AddWithValue("$id", workEntryId);\n            restoreHandoff.ExecuteNonQuery();\n        }\n\n        transaction.Commit();\n        return reopened;\n    }\n\n    public bool DismissCompletedWorkFromHandoff(\n        long workEntryId,\n        DateTimeOffset? dismissedUtc = null)\n    {\n        if (workEntryId <= 0)\n        {\n            throw new ArgumentOutOfRangeException(nameof(workEntryId));\n        }\n\n        using var connection = OpenConnection();\n        if (TableExists(connection, "missing_bol_work_links"))\n        {\n            using var legacyCheck = connection.CreateCommand();\n            legacyCheck.CommandText = """\n                SELECT 1\n                FROM missing_bol_work_links\n                WHERE work_entry_id = $id\n                LIMIT 1;\n                """;\n            legacyCheck.Parameters.AddWithValue("$id", workEntryId);\n            if (legacyCheck.ExecuteScalar() is not null)\n            {\n                return false;\n            }\n        }\n\n        using var command = connection.CreateCommand();\n        command.CommandText = """\n            INSERT INTO handoff_dismissals(work_entry_id, dismissed_utc)\n            SELECT work.id, $dismissedUtc\n            FROM work_entries AS work\n            WHERE work.id = $id\n              AND (work.status = 'Done' OR work.resolved_utc IS NOT NULL)\n            ON CONFLICT(work_entry_id) DO NOTHING;\n            """;\n        command.Parameters.AddWithValue("$id", workEntryId);\n        command.Parameters.AddWithValue(\n            "$dismissedUtc",\n            FormatUtc((dismissedUtc ?? DateTimeOffset.UtcNow).ToUniversalTime()));\n        return command.ExecuteNonQuery() == 1;\n    }\n''')
          replace(rel,
          '''        command.CommandText = WorkEntrySelect + """\n            WHERE\n                (work.resolved_utc IS NULL AND work.status IN ('Waiting', 'FollowUp'))\n                OR\n                (work.status = 'Done' AND work.created_utc >= $startUtc AND work.created_utc < $endUtc)\n                OR\n                (work.resolved_utc >= $startUtc AND work.resolved_utc < $endUtc);\n            """;\n''',
          '''        command.CommandText = WorkEntrySelect + """\n            WHERE NOT EXISTS (\n                SELECT 1\n                FROM handoff_dismissals AS dismissal\n                WHERE dismissal.work_entry_id = work.id\n            )\n              AND (\n                    (work.resolved_utc IS NULL AND work.status IN ('Waiting', 'FollowUp'))\n                    OR\n                    (work.status = 'Done' AND work.created_utc >= $startUtc AND work.created_utc < $endUtc)\n                    OR\n                    (work.resolved_utc >= $startUtc AND work.resolved_utc < $endUtc)\n                  );\n            """;\n''')
          replace(rel,
          '''        using var connection = OpenConnection();\n        using (var pragmas = connection.CreateCommand())\n''',
          '''        using var connection = OpenConnection();\n        EnsureCompatibleExistingSchema(connection);\n        using (var pragmas = connection.CreateCommand())\n''')
          replace(rel,
          '''                CREATE TABLE IF NOT EXISTS work_entries (\n                    id INTEGER PRIMARY KEY AUTOINCREMENT,\n                    driver_code TEXT NOT NULL COLLATE NOCASE,\n                    text TEXT NOT NULL CHECK (length(trim(text)) > 0),\n                    status TEXT NOT NULL CHECK (status IN ('Done', 'Waiting', 'FollowUp')),\n                    created_utc TEXT NOT NULL,\n                    resolved_utc TEXT NULL,\n                    source TEXT NOT NULL CHECK (source IN ('Manual', 'IdleContact')),\n                    linked_idle_contact_event_id INTEGER NULL,\n                    report_cycle_date_snapshot TEXT NULL,\n                    unit_code_snapshot TEXT NOT NULL,\n                    driver_leader_snapshot TEXT NOT NULL,\n                    FOREIGN KEY (driver_code) REFERENCES drivers(driver_code),\n                    FOREIGN KEY (linked_idle_contact_event_id) REFERENCES idle_contact_events(id)\n                );\n\n                CREATE INDEX IF NOT EXISTS ix_observations_week\n''',
          '''                CREATE TABLE IF NOT EXISTS work_entries (\n                    id INTEGER PRIMARY KEY AUTOINCREMENT,\n                    driver_code TEXT NOT NULL COLLATE NOCASE,\n                    text TEXT NOT NULL CHECK (length(trim(text)) > 0),\n                    status TEXT NOT NULL CHECK (status IN ('Done', 'Waiting', 'FollowUp')),\n                    created_utc TEXT NOT NULL,\n                    resolved_utc TEXT NULL,\n                    source TEXT NOT NULL CHECK (source IN ('Manual', 'IdleContact')),\n                    linked_idle_contact_event_id INTEGER NULL,\n                    report_cycle_date_snapshot TEXT NULL,\n                    unit_code_snapshot TEXT NOT NULL,\n                    driver_leader_snapshot TEXT NOT NULL,\n                    FOREIGN KEY (driver_code) REFERENCES drivers(driver_code),\n                    FOREIGN KEY (linked_idle_contact_event_id) REFERENCES idle_contact_events(id)\n                );\n\n                CREATE TABLE IF NOT EXISTS handoff_dismissals (\n                    work_entry_id INTEGER PRIMARY KEY,\n                    dismissed_utc TEXT NOT NULL,\n                    FOREIGN KEY (work_entry_id) REFERENCES work_entries(id)\n                );\n\n                CREATE INDEX IF NOT EXISTS ix_observations_week\n''')
          replace(rel, 'version.CommandText = "PRAGMA user_version = 2;";', 'version.CommandText = "PRAGMA user_version = 3;";')
          replace(rel,
          '''    private static string? GetStateValue(SqliteConnection connection, string key)\n''',
          '''    private static void EnsureCompatibleExistingSchema(SqliteConnection connection)\n    {\n        if (!TableExists(connection, "drivers"))\n        {\n            return;\n        }\n\n        using var command = connection.CreateCommand();\n        command.CommandText = "SELECT name FROM pragma_table_info('drivers');";\n        using var reader = command.ExecuteReader();\n        var columns = new HashSet<string>(StringComparer.OrdinalIgnoreCase);\n        while (reader.Read())\n        {\n            columns.Add(reader.GetString(0));\n        }\n\n        if (columns.Contains("driver_code"))\n        {\n            return;\n        }\n\n        throw new InvalidOperationException(\n            "The existing WAA database uses an incompatible older schema. " +\n            "Initialization stopped before applying current schema changes. " +\n            "Preserve the existing database and use an explicit migration or the intended current-generation data path.");\n    }\n\n    private static bool TableExists(SqliteConnection connection, string tableName)\n    {\n        using var command = connection.CreateCommand();\n        command.CommandText = """\n            SELECT EXISTS(\n                SELECT 1\n                FROM sqlite_master\n                WHERE type = 'table' AND name = $name\n            );\n            """;\n        command.Parameters.AddWithValue("$name", tableName);\n        return Convert.ToInt32(command.ExecuteScalar(), CultureInfo.InvariantCulture) == 1;\n    }\n\n    private static string? GetStateValue(SqliteConnection connection, string key)\n''')

          # Missing BOL compatibility reads tolerate normal SQLite contention.
          replace('src/Waa.App/Data/MissingBolRepository.cs',
          '''    private SqliteConnection OpenConnection()\n    {\n        var connection = new SqliteConnection(_connectionString);\n        connection.Open();\n        return connection;\n    }\n''',
          '''    private SqliteConnection OpenConnection()\n    {\n        var connection = new SqliteConnection(_connectionString);\n        connection.Open();\n        using var pragma = connection.CreateCommand();\n        pragma.CommandText = "PRAGMA busy_timeout = 5000;";\n        pragma.ExecuteNonQuery();\n        return connection;\n    }\n''')

          # Compact Handoff formatter: BOL artifacts never count as ordinary work; remove dead legacy formatter API.
          rel = 'src/Waa.App/Services/HandoffService.cs'
          replace(rel,
          '''        var needsFollowUp = uniqueEntries\n            .Where(entry =>\n                entry.ResolvedUtc is null &&\n                entry.Status == WorkEntryStatus.FollowUp)\n''',
          '''        var needsFollowUp = uniqueEntries\n            .Where(entry =>\n                IsOrdinaryWork(entry) &&\n                entry.ResolvedUtc is null &&\n                entry.Status == WorkEntryStatus.FollowUp)\n''')
          replace(rel,
          '''        var waiting = uniqueEntries\n            .Where(entry =>\n                entry.ResolvedUtc is null &&\n                entry.Status == WorkEntryStatus.Waiting)\n''',
          '''        var waiting = uniqueEntries\n            .Where(entry =>\n                IsOrdinaryWork(entry) &&\n                entry.ResolvedUtc is null &&\n                entry.Status == WorkEntryStatus.Waiting)\n''')
          replace(rel,
          '''        var completedToday = uniqueEntries\n            .Where(entry =>\n                entry.Source != WorkEntrySource.MissingBolTask &&\n                ((entry.Status == WorkEntryStatus.Done && localDay.Contains(entry.CreatedUtc)) ||\n''',
          '''        var completedToday = uniqueEntries\n            .Where(entry =>\n                IsOrdinaryWork(entry) &&\n                ((entry.Status == WorkEntryStatus.Done && localDay.Contains(entry.CreatedUtc)) ||\n''', 1)
          replace(rel, '            .Where(entry => entry.Source != WorkEntrySource.MissingBolTask)\n', '            .Where(IsOrdinaryWork)\n', 1)
          text = read(rel)
          start = text.index('    // Compatibility formatter retained for repository/integration regression tests.')
          end = text.index('    private static NarrativeGroup BuildNarrativeGroup(', start)
          text = text[:start] + text[end:]
          text = text.replace(
          '''    private static DateTimeOffset GetNarrativeTimestamp(WorkEntryRecord entry) =>\n        entry.ResolvedUtc ?? entry.CreatedUtc;\n\n    private static DateTimeOffset GetCompletionTimestamp(WorkEntryRecord entry) =>\n        entry.Status == WorkEntryStatus.Done\n            ? entry.CreatedUtc\n            : entry.ResolvedUtc ?? entry.CreatedUtc;\n''',
          '''    private static bool IsOrdinaryWork(WorkEntryRecord entry) =>\n        entry.Source is not WorkEntrySource.MissingBolTask and not WorkEntrySource.MissingBolAction;\n\n    private static DateTimeOffset GetNarrativeTimestamp(WorkEntryRecord entry) =>\n        entry.ResolvedUtc ?? entry.CreatedUtc;\n''')
          start = text.index('    private static IEnumerable<WorkEntryRecord> OrderLegacyUnresolved(')
          end = text.index('    private static string CollapseWhitespace(', start)
          text = text[:start] + text[end:]
          write(rel, text)

          # Source-only BOL is explicitly non-actionable rather than pretending to be resolved.
          replace('src/Waa.App/ViewModels/MissingBolViewModel.cs',
          '''    public MissingBolViewModel(\n        MissingBolRepository repository,\n        Func<string, Task> onStateChanged,\n        Action<string> reportStatus)\n''',
          '''    public MissingBolViewModel(\n        MissingBolRepository repository,\n        Action<string> reportStatus)\n''')
          replace('src/Waa.App/ViewModels/MissingBolViewModel.cs',
          '''\n    // The old Driver Workspace builder only adds BOL rows to NEEDS ATTENTION when\n    // IsResolved is false. Source-only BOL rows are information, not actionable\n    // work, so keep them out of that list (and therefore out of Next Work Item).\n    // They are displayed in their own CURRENT MISSING BOL section instead.\n    public bool IsResolved => true;\n''', '\n')

          rel = 'src/Waa.App/ViewModels/MainViewModel.cs'
          replace(rel,
          '''            MissingBol = new MissingBolViewModel(\n                missingBolRepository,\n                OnMissingBolChangedAsync,\n                message => StatusMessage = message);\n''',
          '''            MissingBol = new MissingBolViewModel(\n                missingBolRepository,\n                message => StatusMessage = message);\n''')
          text = read(rel)
          start = text.index('        if (MissingBol is not null)\n        {\n            foreach (var bol in MissingBol.Items.Where(item => !item.IsResolved))')
          end = text.index('        foreach (var work in Work.OpenEntries', start)
          text = text[:start] + text[end:]
          dead = '''    private async Task OnMissingBolChangedAsync(string driverCode)\n    {\n        var preserveLocation = _navigator.Current;\n        await ReloadFleetAsync(driverCode);\n        await RestoreLocationAsync(preserveLocation);\n    }\n\n'''
          if dead not in text:
              raise RuntimeError('Missing stale Missing BOL callback')
          write(rel, text.replace(dead, '', 1))

          # Handoff ViewModel with safe, persisted completed-item removal.
          write('src/Waa.App/ViewModels/HandoffViewModel.cs', '''using System.Collections.ObjectModel;
using System.Globalization;
using Waa.App.Data;
using Waa.App.Infrastructure;
using Waa.App.Services;

namespace Waa.App.ViewModels;

public sealed class HandoffViewModel : ObservableObject
{
    private readonly WaaRepository _repository;
    private readonly MissingBolRepository? _missingBolRepository;
    private readonly HandoffService _handoffService;
    private readonly IClipboardService _clipboardService;
    private readonly Action<string> _reportStatus;
    private readonly Func<DateTimeOffset> _now;
    private readonly TimeZoneInfo _timeZone;
    private string _draftText = string.Empty;
    private string _summaryText = "Handoff has not been generated.";
    private bool _isBusy;
    private bool _hasGenerated;

    public HandoffViewModel(
        WaaRepository repository,
        HandoffService handoffService,
        IClipboardService clipboardService,
        Action<string> reportStatus,
        Func<DateTimeOffset>? now = null,
        TimeZoneInfo? timeZone = null,
        MissingBolRepository? missingBolRepository = null)
    {
        _repository = repository;
        _missingBolRepository = missingBolRepository;
        _handoffService = handoffService;
        _clipboardService = clipboardService;
        _reportStatus = reportStatus;
        _now = now ?? (() => DateTimeOffset.Now);
        _timeZone = timeZone ?? TimeZoneInfo.Local;

        RegenerateCommand = new AsyncRelayCommand(RegenerateAsync, () => !IsBusy);
        CopyCommand = new AsyncRelayCommand(CopyAsync, () => !IsBusy && DraftText.Length > 0);
        DismissWorkedItemCommand = new AsyncRelayCommand<HandoffWorkedItemViewModel>(
            DismissWorkedItemAsync,
            item => !IsBusy && item is not null);
    }

    public ObservableCollection<HandoffWorkedItemViewModel> WorkedItems { get; } = new();
    public AsyncRelayCommand RegenerateCommand { get; }
    public AsyncRelayCommand CopyCommand { get; }
    public AsyncRelayCommand<HandoffWorkedItemViewModel> DismissWorkedItemCommand { get; }
    public bool HasGenerated => _hasGenerated;
    public bool HasWorkedItems => WorkedItems.Count > 0;

    public string DraftText
    {
        get => _draftText;
        set
        {
            if (SetProperty(ref _draftText, value))
            {
                CopyCommand.RaiseCanExecuteChanged();
            }
        }
    }

    public string SummaryText
    {
        get => _summaryText;
        private set => SetProperty(ref _summaryText, value);
    }

    public bool IsBusy
    {
        get => _isBusy;
        private set
        {
            if (SetProperty(ref _isBusy, value))
            {
                RegenerateCommand.RaiseCanExecuteChanged();
                CopyCommand.RaiseCanExecuteChanged();
                DismissWorkedItemCommand.RaiseCanExecuteChanged();
            }
        }
    }

    public Task OpenAsync() => _hasGenerated ? Task.CompletedTask : RegenerateAsync();

    public async Task RegenerateAsync()
    {
        try
        {
            IsBusy = true;
            var day = LocalDayRange.Create(_now(), _timeZone);
            var loaded = await Task.Run(() =>
            {
                var fleet = _repository.LoadFleet();
                var saved = _repository.LoadHandoffEntries(day.StartUtc, day.EndUtc);
                var classified = _missingBolRepository?.ApplyWorkSources(saved) ?? saved;
                var currentWork = classified
                    .Where(entry => entry.Source is not WorkEntrySource.MissingBolTask and not WorkEntrySource.MissingBolAction)
                    .ToArray();
                var currentBol = _missingBolRepository?.BuildCurrentHandoffEntries(fleet.Drivers)
                    ?? Array.Empty<WorkEntryRecord>();
                return (
                    Entries: currentWork.Concat(currentBol).ToArray(),
                    CurrentWork: currentWork,
                    Drivers: fleet.Drivers);
            });
            var result = _handoffService.Generate(
                loaded.Entries,
                loaded.Drivers,
                day);
            DraftText = result.Text;
            ReplaceWorkedItems(loaded.CurrentWork, loaded.Drivers, day);
            SummaryText =
                $"{result.DriverLineCount} driver notes  •  " +
                $"{result.MissingBolDriverCount} drivers with Missing BOL  •  " +
                $"{result.MissingBolOrderCount} BOL orders in current file";
            _hasGenerated = true;
            OnPropertyChanged(nameof(HasGenerated));
            _reportStatus($"Handoff regenerated from saved work and the current Missing BOL workbook for {day.LocalDate:M/d/yyyy}.");
        }
        catch (Exception exception)
        {
            AppLog.Write(exception, "Handoff generation failed");
            _reportStatus($"Handoff could not be generated: {exception.Message}");
        }
        finally
        {
            IsBusy = false;
        }
    }

    public Task CopyAsync()
    {
        try
        {
            _clipboardService.SetText(DraftText);
            _reportStatus("Current handoff text copied to the Windows clipboard.");
        }
        catch (Exception exception)
        {
            AppLog.Write(exception, "Handoff clipboard copy failed");
            _reportStatus($"Handoff could not be copied: {exception.Message}");
        }

        return Task.CompletedTask;
    }

    private async Task DismissWorkedItemAsync(HandoffWorkedItemViewModel? item)
    {
        if (item is null)
        {
            return;
        }

        var changed = false;
        try
        {
            IsBusy = true;
            changed = await Task.Run(() => _repository.DismissCompletedWorkFromHandoff(item.WorkEntryId));
            if (!changed)
            {
                _reportStatus("That item is not eligible to be removed from Handoff, or it was already removed.");
            }
        }
        catch (Exception exception)
        {
            AppLog.Write(exception, "Handoff completed-work dismissal failed");
            _reportStatus($"The worked item could not be removed from Handoff: {exception.Message}");
        }
        finally
        {
            IsBusy = false;
        }

        if (!changed)
        {
            return;
        }

        await RegenerateAsync();
        if (WorkedItems.Any(worked => worked.WorkEntryId == item.WorkEntryId))
        {
            _reportStatus(
                $"Removed completed Handoff item for {item.DriverName} from future regenerations, " +
                "but the draft could not be refreshed. Work history was preserved.");
            return;
        }

        _reportStatus($"Removed completed Handoff item for {item.DriverName}. Work history was preserved.");
    }

    private void ReplaceWorkedItems(
        IReadOnlyCollection<WorkEntryRecord> workEntries,
        IReadOnlyCollection<FleetDriverRecord> currentDrivers,
        LocalDayRange day)
    {
        var currentByCode = currentDrivers
            .GroupBy(driver => driver.DriverCode, StringComparer.OrdinalIgnoreCase)
            .ToDictionary(group => group.Key, group => group.First(), StringComparer.OrdinalIgnoreCase);
        var completed = workEntries
            .Where(entry =>
                (entry.Status == WorkEntryStatus.Done && day.Contains(entry.CreatedUtc)) ||
                (entry.ResolvedUtc is { } resolvedUtc && day.Contains(resolvedUtc)))
            .OrderByDescending(entry => entry.ResolvedUtc ?? entry.CreatedUtc)
            .ThenBy(entry => entry.DriverName, StringComparer.OrdinalIgnoreCase)
            .ThenBy(entry => entry.Id)
            .ToArray();

        WorkedItems.Clear();
        foreach (var entry in completed)
        {
            currentByCode.TryGetValue(entry.DriverCode, out var currentDriver);
            WorkedItems.Add(new HandoffWorkedItemViewModel(entry, currentDriver, _timeZone));
        }

        OnPropertyChanged(nameof(HasWorkedItems));
    }
}

public sealed class HandoffWorkedItemViewModel
{
    public HandoffWorkedItemViewModel(
        WorkEntryRecord record,
        FleetDriverRecord? currentDriver,
        TimeZoneInfo timeZone)
    {
        Record = record;
        var unitCode = IsMeaningful(currentDriver?.UnitCode)
            ? currentDriver!.UnitCode.Trim()
            : IsMeaningful(record.UnitCodeSnapshot)
                ? record.UnitCodeSnapshot.Trim()
                : string.Empty;
        DriverName = currentDriver?.DriverName ?? record.DriverName;
        IdentityDisplay = unitCode.Length == 0
            ? $"{DriverName} [{record.DriverCode}]"
            : $"{unitCode} — {DriverName} [{record.DriverCode}]";
        TextDisplay = CollapseWhitespace(record.Text);
        var completedUtc = record.ResolvedUtc ?? record.CreatedUtc;
        CompletedDisplay = TimeZoneInfo.ConvertTime(completedUtc, timeZone)
            .ToString("g", CultureInfo.CurrentCulture);
    }

    public WorkEntryRecord Record { get; }
    public long WorkEntryId => Record.Id;
    public string DriverName { get; }
    public string IdentityDisplay { get; }
    public string TextDisplay { get; }
    public string CompletedDisplay { get; }

    private static bool IsMeaningful(string? value) =>
        !string.IsNullOrWhiteSpace(value) && value.Trim() != "*";

    private static string CollapseWhitespace(string value) =>
        string.Join(' ', value.Split((char[]?)null, StringSplitOptions.RemoveEmptyEntries));
}
''')

          write('src/Waa.App/Views/HandoffView.xaml', '''<UserControl x:Class="Waa.App.Views.HandoffView"
             xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
             xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
             xmlns:automation="clr-namespace:System.Windows.Automation;assembly=PresentationCore">
    <Grid>
        <Grid.RowDefinitions>
            <RowDefinition Height="Auto" />
            <RowDefinition Height="*" />
            <RowDefinition Height="Auto" />
        </Grid.RowDefinitions>

        <Border Grid.Row="0" Style="{StaticResource PanelCardStyle}">
            <Grid>
                <Grid.ColumnDefinitions>
                    <ColumnDefinition Width="*" />
                    <ColumnDefinition Width="Auto" />
                </Grid.ColumnDefinitions>
                <StackPanel>
                    <TextBlock Text="Shift Handoff" Style="{StaticResource PageTitleStyle}" />
                    <TextBlock Margin="0,3,0,0"
                               Text="{Binding DataContext.Handoff.SummaryText, RelativeSource={RelativeSource AncestorType={x:Type Window}}}"
                               Style="{StaticResource SubtleTextStyle}" />
                </StackPanel>
                <StackPanel Grid.Column="1" Orientation="Horizontal" VerticalAlignment="Center">
                    <Button Margin="0,0,8,0"
                            Content="Regenerate"
                            Command="{Binding DataContext.Handoff.RegenerateCommand, RelativeSource={RelativeSource AncestorType={x:Type Window}}}"
                            automation:AutomationProperties.Name="Regenerate handoff from saved work" />
                    <Button Content="Copy to Clipboard"
                            Command="{Binding DataContext.Handoff.CopyCommand, RelativeSource={RelativeSource AncestorType={x:Type Window}}}"
                            Style="{StaticResource PrimaryButtonStyle}"
                            automation:AutomationProperties.Name="Copy current handoff draft to clipboard" />
                </StackPanel>
            </Grid>
        </Border>

        <Border Grid.Row="1" Margin="0,10,0,0" Style="{StaticResource PanelCardStyle}" Padding="10">
            <TextBox AcceptsReturn="True"
                     AcceptsTab="True"
                     TextWrapping="NoWrap"
                     VerticalContentAlignment="Top"
                     VerticalScrollBarVisibility="Auto"
                     HorizontalScrollBarVisibility="Auto"
                     FontFamily="Consolas"
                     Text="{Binding DataContext.Handoff.DraftText, RelativeSource={RelativeSource AncestorType={x:Type Window}}, UpdateSourceTrigger=PropertyChanged}"
                     automation:AutomationProperties.Name="Editable shift handoff draft" />
        </Border>

        <Border Grid.Row="2" Margin="0,10,0,0" Style="{StaticResource PanelCardStyle}" Padding="10">
            <StackPanel>
                <TextBlock Text="Worked items in this Handoff" FontWeight="SemiBold" />
                <TextBlock Margin="0,3,0,8"
                           Text="Remove hides a completed item from future regenerated Handoffs. The saved work/history record is not deleted. Open Waiting or Follow-up work cannot be removed here. Removing an item regenerates the draft."
                           TextWrapping="Wrap"
                           Style="{StaticResource SubtleTextStyle}" />
                <TextBlock Text="No completed work items are currently included.">
                    <TextBlock.Style>
                        <Style TargetType="TextBlock" BasedOn="{StaticResource SubtleTextStyle}">
                            <Setter Property="Visibility" Value="Collapsed" />
                            <Style.Triggers>
                                <DataTrigger Binding="{Binding DataContext.Handoff.HasWorkedItems, RelativeSource={RelativeSource AncestorType={x:Type Window}}}" Value="False">
                                    <Setter Property="Visibility" Value="Visible" />
                                </DataTrigger>
                            </Style.Triggers>
                        </Style>
                    </TextBlock.Style>
                </TextBlock>
                <ScrollViewer MaxHeight="180" VerticalScrollBarVisibility="Auto">
                    <ItemsControl ItemsSource="{Binding DataContext.Handoff.WorkedItems, RelativeSource={RelativeSource AncestorType={x:Type Window}}}">
                        <ItemsControl.ItemTemplate>
                            <DataTemplate>
                                <Border Padding="8" Margin="0,0,0,6" BorderThickness="1" BorderBrush="{DynamicResource BorderBrush}">
                                    <Grid>
                                        <Grid.ColumnDefinitions>
                                            <ColumnDefinition Width="180" />
                                            <ColumnDefinition Width="*" />
                                            <ColumnDefinition Width="130" />
