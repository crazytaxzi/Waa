name: Publish WAA v0.4.7 Audit Hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.4.7-audit.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Recover and apply audited source patch
        shell: pwsh
        run: |
          $bootstrapCommit = '3f538fc59a97a5c26aad5e095577f3dfb7a2c1d8'
          $legacy = @(git show "$bootstrapCommit`:.github/workflows/release-v0.4.7-audit.yml")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $start = [Array]::IndexOf($legacy, "          @'")
          $end = [Array]::IndexOf($legacy, "          '@ | python -")
          if ($start -lt 0 -or $end -le $start) {
            throw 'Could not recover the audited v0.4.7 patch payload from the bootstrap commit.'
          }

          $python = for ($i = $start + 1; $i -lt $end; $i++) {
            $line = $legacy[$i]
            if ($line.StartsWith('          ')) { $line.Substring(10) } else { $line }
          }
          $script = Join-Path $env:RUNNER_TEMP 'apply-waa-v0.4.7.py'
          $python | Set-Content -Path $script -Encoding utf8
          python $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format Waa.sln --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format Waa.sln --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name 'WAA Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add AGENTS.md README.md docs src tests
          git commit -m 'WAA v0.4.7 audit hardening and Handoff cleanup'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $productSha = (git rev-parse HEAD).Trim()
          "PRODUCT_SHA=$productSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        shell: pwsh
        run: dotnet restore Waa.sln

      - name: Build
        shell: pwsh
        run: dotnet build Waa.sln --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test Waa.sln --configuration Release --no-build

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: dotnet list Waa.sln package --vulnerable --include-transitive

      - name: Publish portable win-x64 application
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'artifacts\WAA-Portable-win-x64'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          dotnet publish src\Waa.App\Waa.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item portable\README-FIRST.txt (Join-Path $output 'README-FIRST.txt')
          @(
            'WAA portable build',
            'Release: v0.4.7',
            "Product commit: $env:PRODUCT_SHA",
            "Built UTC: $([DateTime]::UtcNow.ToString('O'))",
            '.NET 8 Windows x64 self-contained'
          ) | Set-Content -Path (Join-Path $output 'BUILD.txt') -Encoding UTF8

      - name: Package release ZIP and checksum
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'artifacts\WAA-Portable-win-x64-v0.4.7.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $PWD 'artifacts\WAA-Portable-win-x64\*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WAA-Portable-win-x64-v0.4.7.zip" | Set-Content -Path (Join-Path $PWD 'artifacts\WAA-Portable-win-x64-v0.4.7.sha256') -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAA-Portable-win-x64-v0.4.7
          path: |
            artifacts/WAA-Portable-win-x64-v0.4.7.zip
            artifacts/WAA-Portable-win-x64-v0.4.7.sha256
          if-no-files-found: error

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          WAA v0.4.7 — Audit Hardening + Handoff Cleanup

          - Adds non-destructive Remove controls for completed/resolved ordinary work represented in Handoff.
          - Removed items stay in saved work/history but are excluded from future regenerated Handoffs.
          - Reopening dismissed Waiting/Follow-up work restores it to Handoff automatically.
          - Open Waiting/Follow-up work and Missing BOL rows cannot be removed from Handoff.
          - Adds a fail-before-write guard for incompatible ancient WAA databases instead of blending schema generations.
          - Prevents legacy Missing BOL task/action rows from inflating ordinary Handoff narrative/counts.
          - Removes the fake current-BOL resolved compatibility flag and obsolete three-section Handoff formatter path.
          - Adds SQLite busy-timeout parity to Missing BOL compatibility reads.
          - Full Windows validation: 24 Core + 192 App = 216 tests.
          - Self-contained Windows x64 portable package.

          Close WAA before replacing the application folder. Preserve your existing data directory; incompatible ancient databases now fail safely before current schema writes rather than being guessed/mutated.
          '@ | Set-Content -Path release-notes.md -Encoding UTF8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = 'v0.4.7'
          $zip = 'artifacts\WAA-Portable-win-x64-v0.4.7.zip'
          $checksum = 'artifacts\WAA-Portable-win-x64-v0.4.7.sha256'

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $checksum --clobber --repo $repo
          }
          else {
            gh release create $tag $zip $checksum `
              --repo $repo `
              --target $env:PRODUCT_SHA `
              --title 'WAA v0.4.7 — Audit Hardening + Handoff Cleanup' `
              --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
