name: Windows build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Waa.sln

      - name: Build
        run: dotnet build Waa.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Waa.sln --configuration Release --no-build --logger "trx;LogFileName=waa-tests.trx"
